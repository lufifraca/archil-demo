<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archil disk · live</title>
<style>
  /* Matches the "Archil Demo Slides" deck: warm paper, light cards, one red-orange accent. */
  :root {
    --paper: #EDEBE7;
    --card: #F7F6F2;
    --border: #DCD8D1;
    --ink: #181716;
    --muted: #6E6962;
    --arrow: #B9B4AC;
    --orange: #F4401F;
    --orange-text: #D2381B;
    --orange-tint: #FBE6DE;
    --dark: #181716;
    --dark-text: #ECEAE5;
    --dark-muted: #8F8A83;
    --sans: "Archivo", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    overflow: hidden;
    padding: 56px 96px 64px;
    background: var(--paper);
    color: var(--ink);
    font: 24px/1.35 var(--sans);
  }
  .label { font: 500 20px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--orange-text); }

  /* ---------- headline: the one big idea right now ---------- */
  header { margin-bottom: 40px; }
  .eyebrow { display: flex; justify-content: space-between; align-items: baseline; }
  .timer { font: 500 30px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  h1 { margin: 18px 0 10px; font-size: 68px; line-height: 1.05; font-weight: 700; letter-spacing: -.02em; }
  #idea-sub { margin: 0; font-size: 30px; color: var(--muted); min-height: 1.35em; }
  .swap { animation: swap .5s cubic-bezier(.2, .8, .2, 1) both; }

  /* ---------- sandbox -> disk ---------- */
  main { display: grid; grid-template-columns: 1.1fr 190px 1fr; align-items: stretch; min-height: 0; }
  .card { min-height: 0; display: flex; flex-direction: column; border-radius: 22px; padding: 40px 44px; }
  .sandbox { background: var(--card); border: 1px solid var(--border); overflow: hidden; }
  .sandbox h2 { flex: none; margin: 14px 0 26px; font-size: 38px; line-height: 1.15; letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  #steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  #steps li { display: flex; align-items: flex-start; gap: 16px; font-size: 28px; color: var(--muted); animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
  #steps li .mark { flex: none; width: 30px; height: 30px; margin-top: 3px; display: grid; place-items: center; }
  #steps li.running { color: var(--ink); font-weight: 700; }
  #steps li.running .mark::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--orange); animation: pulse 1s ease-in-out infinite; }
  #steps li.failed { color: var(--ink); font-weight: 700; }
  #steps li .why { display: block; font: 400 19px var(--mono); color: var(--orange-text); margin-top: 4px; }
  #steps li.more { font-size: 20px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; }

  #result { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 26px; }
  #result[hidden] { display: none; }
  #chart { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #chart img { max-width: 100%; max-height: 100%; border-radius: 12px; border: 1px solid var(--border); background: #fff; }
  #chart:empty { display: none; }
  #chart { flex-direction: column; gap: 10px; }
  #chart .note { font: 500 17px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  #answer { flex: none; margin: 0; font-size: 24px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #chart:empty + #answer { flex: 1; font-size: 32px; -webkit-line-clamp: 12; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .stats b { display: block; font-size: 64px; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
  .stats span { font: 500 17px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .stats .saved b { color: var(--orange); }

  /* ---------- the two arrows from the deck ---------- */
  .flow { display: flex; flex-direction: column; justify-content: center; gap: 70px; padding: 0 26px; }
  .arrow { text-align: center; }
  .arrow svg { width: 100%; height: 44px; fill: var(--arrow); transition: fill .3s; }
  .arrow.read svg { transform: scaleX(-1); }
  .arrow span { display: block; font: 500 18px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .arrow em { display: block; height: 1.4em; font: 600 18px var(--mono); font-style: normal; color: var(--ink); opacity: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arrow.on svg { animation: nudge-left .7s ease-in-out 2; }
  .arrow.read.on svg { fill: var(--ink); }
  .arrow.save.on svg { fill: var(--orange); animation-name: nudge-right; }
  .arrow.on em { opacity: 1; }
  .arrow.save.on em { color: var(--orange-text); }

  /* ---------- the Archil disk (dark card, like slide 6) ---------- */
  .disk { background: var(--dark); color: var(--dark-text); }
  .disk-head { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }
  .disk-head svg { width: 46px; height: 46px; flex: none; }
  .disk-head .title { font-size: 44px; font-weight: 700; letter-spacing: -.01em; line-height: 1.05; }
  .disk-head .name { font: 20px var(--mono); color: var(--dark-muted); }
  #files { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  #files::-webkit-scrollbar { display: none; }
  #files li { display: flex; align-items: center; gap: 14px; padding: 7px 14px; margin: 0 -14px; border-radius: 10px; font: 26px var(--mono); color: #BDB8B0; }
  #files li .tag { margin-left: auto; font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: var(--dark-muted); }
  #files li.new, #files li.updated { color: #fff; }
  #files li.new .tag, #files li.updated .tag { color: var(--orange); }
  #files li.gone { text-decoration: line-through; color: var(--dark-muted); }
  #files li.enter { animation: slide-in .6s cubic-bezier(.2, .8, .2, 1) both; }
  #files li.glow-read { animation: glow-read 1.8s ease-out; }
  #files li.glow-write { animation: glow-write 1.8s ease-out; }
  .disk-foot { margin-top: 20px; padding-top: 18px; border-top: 1px solid #2E2C2A; font: 18px var(--mono); letter-spacing: .06em; color: var(--dark-muted); }

  @keyframes swap { from { opacity: 0; transform: translateY(14px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @keyframes pulse { 50% { transform: scale(.6); opacity: .5; } }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-30px); } }
  @keyframes nudge-left { 50% { transform: scaleX(-1) translateX(10px); } }
  @keyframes nudge-right { 50% { transform: translateX(10px); } }
  @keyframes glow-read { 0%, 35% { background: rgba(255, 255, 255, .16); color: #fff; } }
  @keyframes glow-write { 0%, 35% { background: rgba(244, 64, 31, .45); color: #fff; } }
</style>
</head>
<body>
<header>
  <div class="eyebrow"><span class="label" id="eyebrow">Live demo</span><span class="timer" id="timer"></span></div>
  <h1 id="idea">Waiting for the agent</h1>
  <p id="idea-sub">Start a run in the terminal.</p>
</header>
<main>
  <section class="card sandbox">
    <div class="label" id="sandbox-label">Sandbox</div>
    <h2 id="task"></h2>
    <ol id="steps"></ol>
    <div id="result" hidden>
      <div id="chart"></div>
      <p id="answer"></p>
      <div class="stats">
        <div><b id="s-steps">0</b><span>Steps</span></div>
        <div class="saved"><b id="s-files">0</b><span>Files saved</span></div>
        <div><b id="s-time">0:00</b><span>Total time</span></div>
      </div>
    </div>
  </section>
  <div class="flow">
    <div class="arrow read" id="arrow-read">
      <svg viewBox="0 0 100 40" preserveAspectRatio="none"><polygon points="0,13 64,13 64,0 100,20 64,40 64,27 0,27"/></svg>
      <span>reads</span><em></em>
    </div>
    <div class="arrow save" id="arrow-save">
      <svg viewBox="0 0 100 40" preserveAspectRatio="none"><polygon points="0,13 64,13 64,0 100,20 64,40 64,27 0,27"/></svg>
      <span>saves</span><em></em>
    </div>
  </div>
  <section class="card disk">
    <div class="disk-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F4401F" stroke-width="1.6" stroke-linecap="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
      <div><div class="title">Archil disk</div><div class="name" id="disk-name"></div></div>
    </div>
    <ul id="files"></ul>
    <div class="disk-foot" id="disk-foot">&nbsp;</div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const plain = (label) => label.replace(/^[^\p{L}\p{N}]+/u, ""); // drop the terminal's emoji
  const CHECK = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6E6962" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  const WARN = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D2381B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>';
  const VISIBLE_STEPS = 5;
  let run = null;

  const clock = (ms) => {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };
  setInterval(() => {
    if (run && !run.done) $("timer").textContent = clock(Date.now() - run.startedAt);
  }, 200);

  // ---------- the big idea: each one stays up long enough to read ----------
  const ideas = [];
  let ideaBusy = false;
  let lastIdea = "";
  function idea(title, sub = "", now = false) {
    if (now) ideas.length = 0, ideaBusy = false;
    if (`${title}|${sub}` === (ideas.at(-1) ? `${ideas.at(-1).title}|${ideas.at(-1).sub}` : lastIdea)) return;
    ideas.push({ title, sub });
    if (ideas.length > 2) ideas.splice(0, ideas.length - 2);
    showNextIdea();
  }
  function showNextIdea() {
    if (ideaBusy || !ideas.length) return;
    const { title, sub } = ideas.shift();
    lastIdea = `${title}|${sub}`;
    for (const [id, text] of [["idea", title], ["idea-sub", sub]]) {
      const el = $(id);
      el.textContent = text;
      el.classList.remove("swap");
      void el.offsetWidth;
      el.classList.add("swap");
    }
    ideaBusy = true;
    setTimeout(() => { ideaBusy = false; showNextIdea(); }, 2400);
  }

  // ---------- steps ----------
  function stepItem(e) {
    let li = run.steps.get(e.id);
    if (!li) {
      li = document.createElement("li");
      li.innerHTML = '<span class="mark"></span><span><span class="text"></span><span class="why"></span></span>';
      run.steps.set(e.id, li);
      $("steps").append(li);
      trimSteps();
    }
    li.querySelector(".text").textContent = plain(e.label);
    return li;
  }
  function trimSteps() {
    const items = [...run.steps.values()];
    const hidden = Math.max(0, items.length - VISIBLE_STEPS);
    items.forEach((li, i) => (li.hidden = i < hidden));
    let more = $("steps").querySelector(".more");
    if (hidden && !more) {
      more = document.createElement("li");
      more.className = "more";
      $("steps").prepend(more);
    }
    if (more) more.textContent = `+ ${hidden} earlier step${hidden === 1 ? "" : "s"}`;
  }

  // ---------- files on the disk ----------
  function fileRow(path, { old = false } = {}) {
    if (run.files.has(path)) return run.files.get(path);
    const li = document.createElement("li");
    li.innerHTML = '<span class="name"></span><span class="tag"></span>';
    li.querySelector(".name").textContent = path;
    li.className = old ? "old" : "new enter";
    li.querySelector(".tag").textContent = old ? "" : "new";
    li.old = old;
    const order = (p) => (p === "pylib/" ? "~" : p); // pylib/ last, like the deck
    const after = [...$("files").children].find((r) => order(r.querySelector(".name").textContent) > order(path));
    $("files").insertBefore(li, after ?? null);
    run.files.set(path, li);
    updateFoot();
    if (!old) li.scrollIntoView({ behavior: "smooth", block: "nearest" });
    return li;
  }
  function glow(li, kind) {
    li.classList.remove("glow-read", "glow-write", "gone");
    void li.offsetWidth;
    li.classList.add(`glow-${kind}`);
  }
  function flash(arrowId, path) {
    const arrow = $(arrowId);
    arrow.querySelector("em").textContent = path;
    arrow.classList.remove("on");
    void arrow.offsetWidth;
    arrow.classList.add("on");
    clearTimeout(arrow.timer);
    arrow.timer = setTimeout(() => arrow.classList.remove("on"), 1800);
  }
  function updateFoot() {
    const rows = [...run.files.values()].filter((li) => !li.classList.contains("gone"));
    const fresh = rows.filter((li) => !li.old).length;
    $("disk-foot").textContent = `${rows.length} items · ${fresh ? `${fresh} new this run` : "all from earlier runs"}`;
  }

  // ---------- events ----------
  const handlers = {
    run_start(e) {
      run = { startedAt: e.startedAt, steps: new Map(), files: new Map(), written: new Set(), done: false };
      document.title = e.practice ? "Practice · Archil disk" : "Archil disk · live";
      $("eyebrow").textContent = e.runNumber > 1 ? `Live demo · Run ${e.runNumber}, new sandbox` : "Live demo · Run 1";
      $("sandbox-label").textContent = `Sandbox #${e.runNumber} · fresh`;
      $("task").textContent = e.prompt;
      $("disk-name").textContent = e.diskName;
      $("steps").innerHTML = "";
      $("files").innerHTML = "";
      $("steps").hidden = false;
      $("task").hidden = false;
      $("result").hidden = true;
      e.existing.forEach((f) => fileRow(f.path, { old: true }));
      updateFoot();
      idea(
        "A brand-new sandbox",
        e.runNumber > 1 ? "Nothing in it but the disk, and the disk still has the earlier runs' work." : "Nothing in it but the Archil disk: the taxi data and Python libraries.",
        true,
      );
    },
    step_start(e) {
      const li = stepItem(e);
      li.className = "running";
      li.querySelector(".mark").innerHTML = "";
      const label = plain(e.label);
      if (e.kind === "list") idea("Checking the disk for earlier work", "Each run starts in a new sandbox. The disk is its only memory.");
      else if (/^Install/.test(label)) idea("Installing Python packages");
      else if (e.kind === "run") idea(`${label} in the sandbox`, "The code reads and writes the disk like a normal folder.");
    },
    step_end(e) {
      const li = stepItem(e);
      li.className = e.ok ? "done" : "failed";
      li.querySelector(".mark").innerHTML = e.ok ? CHECK : WARN;
      li.querySelector(".why").textContent = e.ok ? "" : e.error ?? "";
      if (!e.ok) idea("A step failed", "The agent reads the error and tries again.");
    },
    file_read(e) {
      const li = fileRow(e.path);
      glow(li, "read");
      flash("arrow-read", e.path);
      if (!li.old) return;
      if (/\.(parquet|csv)$/.test(e.path) && e.path.startsWith("data/")) idea("Reading the data straight from the disk", `${e.path}, read in place. No download step.`);
      else idea("Picking up earlier work", `${e.path} was saved by an earlier sandbox.`);
    },
    file_write(e) {
      const li = fileRow(e.path);
      run.written.add(e.path);
      if (li.old && !li.classList.contains("updated")) {
        li.className = "updated";
        li.querySelector(".tag").textContent = "updated";
      }
      glow(li, "write");
      flash("arrow-save", e.path);
      if (li.old) idea(`Updating ${e.path}`, "The next run will see the new version.");
      else idea("Saving to the disk", `${e.path} will outlive this sandbox.`);
    },
    file_delete(e) {
      fileRow(e.path).classList.add("gone");
      updateFoot();
    },
    run_end(e) {
      run.done = true;
      $("timer").textContent = clock(e.totalMs);
      $("s-steps").textContent = e.steps ?? run.steps.size;
      $("s-files").textContent = e.filesWritten ?? run.written.size;
      $("s-time").textContent = clock(e.totalMs);
      $("chart").innerHTML = "";
      if (e.chart) {
        const img = new Image();
        img.src = e.chart.src;
        img.alt = e.chart.name;
        $("chart").append(img);
        if (e.chart.reused) {
          const note = document.createElement("div");
          note.className = "note";
          note.textContent = `${e.chart.name} · saved by an earlier run`;
          $("chart").append(note);
        }
      }
      $("answer").textContent = e.answer ?? "";
      $("sandbox-label").textContent = "Result";
      $("steps").hidden = true;
      $("task").hidden = true; // give the chart the room
      $("result").hidden = false;
      if (e.ok) {
        const n = e.filesWritten ?? run.written.size;
        idea("The sandbox is gone. The work isn't.", `${n} file${n === 1 ? "" : "s"} saved to the Archil disk for the next run.`, true);
      } else {
        idea("The run stopped early", "Whatever it saved is still on the disk.", true);
      }
      if (e.final) events.close(); // a real run's server shuts down after this
    },
  };

  const events = new EventSource("/events");
  events.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === "run_start" || run) handlers[e.type]?.(e);
  };

  // Esc flips between the result and the step list after the run.
  document.addEventListener("keydown", (k) => {
    if (k.key !== "Escape" || !run?.done) return;
    $("steps").hidden = !$("steps").hidden;
    $("result").hidden = !$("steps").hidden;
    $("task").hidden = !$("result").hidden;
    $("sandbox-label").textContent = $("result").hidden ? "Steps" : "Result";
  });
</script>
</body>
</html>
